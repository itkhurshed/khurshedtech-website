<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>MKA — Motion Logo</title>
<style>
  :root{--navy:#071A33;--navy-deep:#03101f;--cyber:#00A8FF;--silver:#C9D1D9;}
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:100%;height:100%;background:var(--navy-deep);overflow:hidden;font-family:'Inter','Poppins','Montserrat',system-ui,sans-serif;}
  #stage{
    position:relative;width:100vw;height:100vh;
    background:radial-gradient(circle at 50% 45%, rgba(0,168,255,.14), transparent 55%),
               linear-gradient(160deg, var(--navy-deep) 0%, var(--navy) 60%, #0a2542 100%);
    display:flex;align-items:center;justify-content:center;
  }
  canvas{position:absolute;inset:0;width:100%;height:100%;}

  #mark{
    position:relative;z-index:5;
    width:260px;height:260px;
    display:flex;align-items:center;justify-content:center;
  }
  svg{width:100%;height:100%;overflow:visible;}

  .letters{
    position:relative;z-index:6;
    display:flex;gap:2px;
    margin-top:0;
    opacity:0;
    transform:scale(.85);
    transition:opacity 1s ease, transform 1.1s cubic-bezier(.2,.8,.2,1);
  }
  .letters.show{opacity:1;transform:scale(1);}
  .letters span{
    font-size:74px;font-weight:800;color:#fff;letter-spacing:2px;
    text-shadow:0 0 30px rgba(0,168,255,.55);
  }
  .letters span.accent{color:var(--cyber);}

  #footer{
    position:absolute;bottom:16%;left:0;right:0;
    text-align:center;z-index:6;
    opacity:0;transform:translateY(14px);
    transition:opacity 1s ease, transform 1s ease;
  }
  #footer.show{opacity:1;transform:translateY(0);}
  #footer .name{font-size:26px;font-weight:700;color:#fff;letter-spacing:.02em;}
  #footer .role{margin-top:8px;font-size:13px;color:var(--cyber);letter-spacing:.3em;text-transform:uppercase;font-weight:600;}

  .particle-burst{position:absolute;inset:0;z-index:4;pointer-events:none;}

  .replay{
    position:absolute;top:26px;right:30px;z-index:10;
    background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.18);
    color:var(--silver);padding:8px 16px;border-radius:999px;
    font-family:inherit;font-size:12px;letter-spacing:.08em;cursor:pointer;
    backdrop-filter:blur(8px);text-transform:uppercase;
  }
  .replay:hover{border-color:var(--cyber);color:#fff;}
  .note{position:absolute;bottom:6%;width:100%;text-align:center;font-size:10px;color:rgba(255,255,255,.28);z-index:10;}
</style>
</head>
<body>
<div id="stage">
  <canvas id="bg"></canvas>

  <div id="mark">
    <svg viewBox="0 0 200 200">
      <!-- circuit lines -->
      <g id="circuit" stroke="#00A8FF" stroke-width="1.4" fill="none" opacity="0">
        <path d="M100,100 L100,20" />
        <path d="M100,100 L170,60" />
        <path d="M100,100 L170,140" />
        <path d="M100,100 L100,180" />
        <path d="M100,100 L30,140" />
        <path d="M100,100 L30,60" />
        <circle cx="100" cy="20" r="4" fill="#00A8FF" stroke="none"/>
        <circle cx="170" cy="60" r="4" fill="#00A8FF" stroke="none"/>
        <circle cx="170" cy="140" r="4" fill="#00A8FF" stroke="none"/>
        <circle cx="100" cy="180" r="4" fill="#00A8FF" stroke="none"/>
        <circle cx="30" cy="140" r="4" fill="#00A8FF" stroke="none"/>
        <circle cx="30" cy="60" r="4" fill="#00A8FF" stroke="none"/>
      </g>
      <!-- shield outline -->
      <path id="shield" d="M100,28 L162,52 V104 C162,144 134,172 100,184 C66,172 38,144 38,104 V52 Z"
            fill="rgba(0,168,255,0.05)" stroke="#00A8FF" stroke-width="2" opacity="0" />
      <!-- center glow point -->
      <circle id="core" cx="100" cy="100" r="6" fill="#00A8FF">
        <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" repeatCount="indefinite" />
      </circle>
    </svg>
  </div>

  <div class="letters" id="letters">
    <span>M</span><span class="accent">K</span><span>A</span>
  </div>

  <div id="footer">
    <div class="name">Engineer Mohammad Khurshed Alam</div>
    <div class="role">IT &middot; Network &middot; Cybersecurity</div>
  </div>

  <button class="replay" onclick="restart()">Replay</button>
  <div class="note">Rendered animation (canvas + SVG) — exported as MP4 alongside this file.</div>
</div>

<script>
// background particle field (sparser, slower — logo is the focus)
const canvas = document.getElementById('bg');
const ctx = canvas.getContext('2d');
let W,H,particles=[];
function resize(){ W=canvas.width=window.innerWidth; H=canvas.height=window.innerHeight; }
window.addEventListener('resize', resize); resize();
for(let i=0;i<36;i++){
  particles.push({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*.15,vy:(Math.random()-.5)*.15,r:Math.random()*1.3+.5});
}
function tick(){
  ctx.clearRect(0,0,W,H);
  for(const p of particles){
    p.x+=p.vx;p.y+=p.vy;
    if(p.x<0||p.x>W)p.vx*=-1;
    if(p.y<0||p.y>H)p.vy*=-1;
    ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
    ctx.fillStyle='rgba(0,168,255,0.55)';ctx.fill();
  }
  requestAnimationFrame(tick);
}
tick();

// sequence
const circuit = document.getElementById('circuit');
const shield = document.getElementById('shield');
const letters = document.getElementById('letters');
const footer = document.getElementById('footer');
let timers = [];

function restart(){
  timers.forEach(t=>clearTimeout(t));
  timers = [];
  circuit.style.transition = 'none';
  circuit.setAttribute('opacity','0');
  shield.style.transition = 'none';
  shield.setAttribute('opacity','0');
  letters.classList.remove('show');
  footer.classList.remove('show');
  // force reflow
  void circuit.offsetWidth;
  circuit.style.transition = 'opacity 1s ease';
  shield.style.transition = 'opacity 1.1s ease';

  timers.push(setTimeout(()=>{ circuit.setAttribute('opacity','1'); }, 500));
  timers.push(setTimeout(()=>{ shield.setAttribute('opacity','1'); }, 1600));
  timers.push(setTimeout(()=>{ letters.classList.add('show'); }, 2600));
  timers.push(setTimeout(()=>{ footer.classList.add('show'); }, 3600));
  timers.push(setTimeout(()=>{ restart(); }, 7200));
}
restart();
</script>
</body>
</html>
